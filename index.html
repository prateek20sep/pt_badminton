<script>
/* ═══ DATABASE — v5 avatars + cash INR ═══ */
const DB_NAME='PTSmashersDB',DB_VER=5;let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains('players')){const s=d.createObjectStore('players',{keyPath:'id',autoIncrement:true});s.createIndex('name','name');s.createIndex('rating','rating')}
  if(!d.objectStoreNames.contains('tournaments')){const s=d.createObjectStore('tournaments',{keyPath:'id',autoIncrement:true});s.createIndex('status','status')}
  if(d.objectStoreNames.contains('matches'))d.deleteObjectStore('matches');
  const ms=d.createObjectStore('matches',{keyPath:'id',autoIncrement:true});ms.createIndex('tournamentId','tournamentId');ms.createIndex('status','status');
};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error)})}
function dbAll(s){return new Promise((r,j)=>{const q=db.transaction(s,'readonly').objectStore(s).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function dbGet(s,id){return new Promise((r,j)=>{const q=db.transaction(s,'readonly').objectStore(s).get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function dbAdd(s,it){return new Promise((r,j)=>{const q=db.transaction(s,'readwrite').objectStore(s).add(it);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function dbPut(s,it){return new Promise((r,j)=>{const q=db.transaction(s,'readwrite').objectStore(s).put(it);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function dbDel(s,id){return new Promise((r,j)=>{const q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=()=>r();q.onerror=()=>j(q.error)})}
function dbIdx(s,idx,val){return new Promise((r,j)=>{const q=db.transaction(s,'readonly').objectStore(s).index(idx).getAll(val);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}

/* ═══ ELO (doubles: avg team rating) ═══ */
const K=32;
function elo(rA,rB){return 1/(1+Math.pow(10,(rB-rA)/400))}
function calcEloDoubles(wAvg,lAvg){const e=elo(wAvg,lAvg);return{wDelta:Math.round(K*(1-e)),lDelta:Math.round(K*(0-elo(lAvg,wAvg)))}}
function tier(r){if(r>=1600)return{l:'Elite',c:'text-amber-700 bg-amber-100',e:'👑'};if(r>=1400)return{l:'Advanced',c:'text-purple-700 bg-purple-100',e:'💎'};if(r>=1250)return{l:'Intermediate',c:'text-blue-700 bg-blue-100',e:'⭐'};if(r>=1100)return{l:'Beginner',c:'text-emerald-700 bg-emerald-100',e:'🌱'};return{l:'Novice',c:'text-gray-600 bg-gray-100',e:'🔰'}}

/* ═══ SCORING ═══ */
function validateScore(s1,s2){
  if(s1<0||s2<0)return{valid:false,msg:'Scores must be positive'};
  if(s1===s2)return{valid:false,msg:'Cannot end in tie'};
  const hi=Math.max(s1,s2),lo=Math.min(s1,s2);
  if(hi<21)return{valid:false,msg:'Winner must score ≥21'};
  if(hi===21&&lo<=19)return{valid:true};
  if(hi===21&&lo===20)return{valid:false,msg:'At 20-20, win by 2 (e.g. 22-20)'};
  if(hi>21&&hi<=30&&(hi-lo)===2)return{valid:true};
  if(hi===30&&lo>=28)return{valid:true};
  if(hi>30)return{valid:false,msg:'Max score is 30'};
  return{valid:false,msg:'After 20-all, win by 2 (max 30)'}
}

/* ═══ HELPERS ═══ */
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function fmtDateShort(d){return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function fmtWeekRange(s,e){return`${fmtDateShort(s)} – ${fmtDateShort(e)}`}
function getWeekLabel(t){return(t.startDate&&t.endDate)?fmtWeekRange(t.startDate,t.endDate):(t.date||'')}
function getDaysLeft(t){if(!t.endDate)return null;const d=Math.ceil((new Date(t.endDate).setHours(23,59,59,999)-Date.now())/864e5);return d>=0?d:null}
function teamNames(ids,pm){return ids.map(id=>pm[id]?.name?.split(' ')[0]||'?').join(' & ')}
function teamNamesFull(ids,pm){return ids.map(id=>pm[id]?.name||'?').join(' & ')}
function teamAvgRating(ids,pm){const ratings=ids.map(id=>pm[id]?.rating||1200);return Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length)}
function firstName(pm,id){return pm[id]?.name?.split(' ')[0]||'?'}

/* ═══ AVATAR SYSTEM ═══ */
const AVATAR_GRADIENTS=[
  'linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#f093fb,#f5576c)',
  'linear-gradient(135deg,#4facfe,#00f2fe)','linear-gradient(135deg,#43e97b,#38f9d7)',
  'linear-gradient(135deg,#fa709a,#fee140)','linear-gradient(135deg,#a18cd1,#fbc2eb)',
  'linear-gradient(135deg,#fccb90,#d57eeb)','linear-gradient(135deg,#e0c3fc,#8ec5fc)',
  'linear-gradient(135deg,#f5576c,#ff6a88)','linear-gradient(135deg,#13547a,#80d0c7)',
  'linear-gradient(135deg,#ff9a9e,#fad0c4)','linear-gradient(135deg,#a1c4fd,#c2e9fb)'
];
function getInitials(name){if(!name)return'?';const p=name.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():name.substring(0,2).toUpperCase()}
function avatarGradient(id){return AVATAR_GRADIENTS[(id||0)%AVATAR_GRADIENTS.length]}
function avatarHTML(p,size='sm'){if(!p)return'';if(p.photo){const sz={'xs':24,'sm':32,'md':40,'lg':56,'xl':80}[size]||32;return`<img src="${p.photo}" class="avatar avatar-${size}" style="object-fit:cover;border:2px solid rgba(255,255,255,.4)" alt="${p.name||''}">`}const g=p.avatarColor||avatarGradient(p.id);const ini=getInitials(p.name);return`<div class="avatar avatar-${size}" style="background:${g}">${ini}</div>`}
function avatarById(pm,id,size='sm'){return avatarHTML(pm[id],size)}

/* ═══ CHALLENGE TYPES ═══ */
const CHALLENGES={
  paya_soup:{label:'Paya Soup',emoji:'🍜',color:'red'},
  chai_bun_maska:{label:'Chai Bun Maska',emoji:'☕',color:'amber'},
  cash:{label:'Cash',emoji:'💰',color:'green'}
};
function challengeBadge(type,cashAmt){const c=CHALLENGES[type];if(!c)return'';const lbl=type==='cash'&&cashAmt?`₹${cashAmt}`:c.label;return`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold ${type==='paya_soup'?'bg-red-100 text-red-700':type==='chai_bun_maska'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}">${c.emoji} ${lbl}</span>`}
function captainBadge(name){return`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold captain-badge">👑 ${name}</span>`}

/* ═══ OWES LOGIC (dual captain) ═══ */
function getOwesFromMatches(matches,pm){
  return matches.filter(m=>m.status==='completed'&&m.challenge&&m.winnerTeam&&m.team1&&m.team2).map(m=>{
    try{
      const wTeam=m.winnerTeam===1?m.team1:m.team2;
      const lTeam=m.winnerTeam===1?m.team2:m.team1;
      // Losing team's captain owes: if team1 wins → captain2 owes, if team2 wins → captain1 owes
      const capId=m.winnerTeam===1?(m.captain2Id||null):(m.captain1Id||null);
      if(!capId)return null;
      return{matchId:m.id,captainId:capId,captainName:pm[capId]?.name||'?',challenge:m.challenge,
        cashAmount:m.cashAmount||null,settled:m.oweSettled||false,
        winNames:(wTeam||[]).map(id=>firstName(pm,id)).join(' & '),
        loseNames:(lTeam||[]).map(id=>firstName(pm,id)).join(' & '),
        winTeam:wTeam||[],loseTeam:lTeam||[]}
    }catch(e){console.warn('Owes calc error for match',m.id,e);return null}
  }).filter(Boolean);
}

/* ═══ ROUND ROBIN GENERATOR ═══ */
function generateRRTeams(playerIds,pm){
  // Snake draft: sort by rating desc, pair 1+N, 2+(N-1), etc.
  const sorted=[...playerIds].sort((a,b)=>(pm[b]?.rating||1200)-(pm[a]?.rating||1200));
  const teams=[];
  const half=Math.floor(sorted.length/2);
  for(let i=0;i<half;i++){
    teams.push([sorted[i],sorted[sorted.length-1-i]]);
  }
  return teams;
}
function generateRRMatches(teams){
  const matches=[];
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      matches.push({team1:teams[i],team2:teams[j]});
    }
  }
  return matches;
}

/* ═══ SEED ═══ */
async function seed(){const p=await dbAll('players');if(p.length)return;

let _pendingPhoto=null;
function previewPhoto(input,previewId){
  const file=input.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert('Image too large. Max 2MB.');input.value='';return}
  compressImage(file,200,0.7).then(dataUrl=>{
    _pendingPhoto=dataUrl;
    const el=document.getElementById(previewId);
    if(el)el.innerHTML=`<img src="${dataUrl}" class="w-full h-full object-cover rounded-full"/>`;
  });
}
function compressImage(file,maxDim,quality){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  const t=tier(p.rating);
  const pms=ms.filter(m=>m.status==='completed'&&((m.team1||[]).includes(id)||(m.team2||[]).includes(id)));
  const wins=pms.filter(m=>{const wt=m.winnerTeam===1?m.team1:m.team2;return(wt||[]).includes(id)});
  const losses=pms.filter(m=>{const lt=m.winnerTeam===1?m.team2:m.team1;return(lt||[]).includes(id)});
  const owes=getOwesFromMatches(ms,pm).filter(o=>o.captainId===id&&!o.settled);
  const owed=getOwesFromMatches(ms,pm).filter(o=>(o.winTeam||[]).includes(id)&&!o.settled);

async function delT(id){
  const t=await dbGet('tournaments',id);if(!t)return;
  const ms=await dbIdx('matches','tournamentId',id);
  const completed=ms.filter(m=>m.status==='completed');

  if(!confirm(msg))return;
  // Revert ELO for completed matches
  const ap=await dbAll('players');const pm=Object.fromEntries(ap.map(p=>[p.id,p]));
  for(const m of completed){
    const wTeam=m.winnerTeam===1?m.team1:m.team2,lTeam=m.winnerTeam===1?m.team2:m.team1;
    const{wDelta,lDelta}=calcEloDoubles(teamAvgRating(wTeam,pm),teamAvgRating(lTeam,pm));

  }

  await dbDel('tournaments',id);rPage();
}

async function addToTeam(team,pid,tId){if(team===1&&newMatchState.t1.length<2)newMatchState.t1.push(pid);if(team===2&&newMatchState.t2.length<2)newMatchState.t2.push(pid);_reloadAndRender(tId)}
async function rmFromTeam(team,pid,tId){if(team===1)newMatchState.t1=newMatchState.t1.filter(id=>id!==pid);if(team===2)newMatchState.t2=newMatchState.t2.filter(id=>id!==pid);if(newMatchState.cap1===pid)newMatchState.cap1=null;if(newMatchState.cap2===pid)newMatchState.cap2=null;_reloadAndRender(tId)}

async function confirmMatch(tId){
  const{t1,t2,round,cap1,cap2,challenge,cashAmount}=newMatchState;

async function delMatch(mid){
  const m=await dbGet('matches',mid);if(!m)return;
  const ap=await dbAll('players');const pm=Object.fromEntries(ap.map(p=>[p.id,p]));
  const t1n=teamNames(m.team1||[],pm),t2n=teamNames(m.team2||[],pm);
  const msg=m.status==='completed'?`Delete match ${t1n} vs ${t2n} (${m.team1Score}-${m.team2Score})?\n\n⚠️ Player ELO ratings will be reverted.`:`Delete pending match ${t1n} vs ${t2n}?`;
  if(!confirm(msg))return;
  // Revert ELO if completed
  if(m.status==='completed'&&m.winnerTeam){
    const wTeam=m.winnerTeam===1?m.team1:m.team2,lTeam=m.winnerTeam===1?m.team2:m.team1;
    const{wDelta,lDelta}=calcEloDoubles(teamAvgRating(wTeam,pm),teamAvgRating(lTeam,pm));
    for(const pid of wTeam){const p=pm[pid];if(p){p.rating-=wDelta;p.wins=Math.max(0,p.wins-1);p.matchesPlayed=Math.max(0,p.matchesPlayed-1);await dbPut('players',p)}}
    for(const pid of lTeam){const p=pm[pid];if(p){p.rating-=lDelta;p.losses=Math.max(0,p.losses-1);p.matchesPlayed=Math.max(0,p.matchesPlayed-1);await dbPut('players',p)}}
  }
  await dbDel('matches',mid);rPage();
}

async function settleAllForPlayer(pid){

  const owes=getOwesFromMatches(ms,pm).filter(o=>o.captainId===pid&&!o.settled);
  if(!owes.length){alert('No pending debts');return}
  if(!confirm('Settle all '+owes.length+' debt(s) for '+(pm[pid]?.name||'player')+'?'))return;

async function startT(id){const t=await dbGet('tournaments',id);t.status='in_progress';await dbPut('tournaments',t);rPage()}
async function completeT(id){const t=await dbGet('tournaments',id);t.status='completed';await dbPut('tournaments',t);rPage()}
async function addRound(tId){const ms=await dbIdx('matches','tournamentId',tId);const maxR=ms.length?Math.max(...ms.map(m=>m.round)):0;aRound=maxR+1;rPage()}

async function subScore(mid){
  const s1=parseInt(document.getElementById(`s1-${mid}`).value),s2=parseInt(document.getElementById(`s2-${mid}`).value);
  if(isNaN(s1)||isNaN(s2)){alert('Enter both scores');return}
  const v=validateScore(s1,s2);if(!v.valid){alert(v.msg);return}
  const m=await dbGet('matches',mid);m.team1Score=s1;m.team2Score=s2;m.winnerTeam=s1>s2?1:2;m.status='completed';m.completedAt=new Date().toISOString();await dbPut('matches',m);
  const ap=await dbAll('players');const pm=Object.fromEntries(ap.map(p=>[p.id,p]));
  const wTeam=m.winnerTeam===1?m.team1:m.team2,lTeam=m.winnerTeam===1?m.team2:m.team1;
  const{wDelta,lDelta}=calcEloDoubles(teamAvgRating(wTeam,pm),teamAvgRating(lTeam,pm));
  for(const id of wTeam){const p=pm[id];if(p){p.rating+=wDelta;p.wins++;p.matchesPlayed++;await dbPut('players',p)}}
  for(const id of lTeam){const p=pm[id];if(p){p.rating+=lDelta;p.losses++;p.matchesPlayed++;await dbPut('players',p)}}
  rPage();
}

// Rank movement tracking via localStorage
function getRankKey(filter){return`pts_ranks_${filter||'all'}`}
function getPrevRanks(filter){try{return JSON.parse(localStorage.getItem(getRankKey(filter)))||{}}catch(e){return{}}}
function saveRanks(filter,ranksMap){try{localStorage.setItem(getRankKey(filter),JSON.stringify(ranksMap))}catch(e){}}
function rankMoveBadge(playerId,currentRank,prevRanks){
  const prev=prevRanks[playerId];
  if(prev===undefined||prev===null)return`<span class="move-badge move-badge-new">🆕 NEW</span>`;
  const diff=prev-currentRank; // positive = moved up
  if(diff>0)return`<span class="move-badge move-badge-up">▲ ${diff}</span>`;
  if(diff<0)return`<span class="move-badge move-badge-down">▼ ${Math.abs(diff)}</span>`;
  return'<span class="rank-same">—</span>';
}

    ${(movedUp.length||movedDown.length)?`<div class="flex items-center justify-center gap-4 flex-wrap">${movedUp.length?`<div class="inline-flex items-center gap-2 bg-green-50 border border-green-200 rounded-xl px-4 py-2"><span class="text-green-600 font-bold text-sm">▲ ${movedUp.length} moved up</span><span class="text-xs text-green-500">${movedUp.slice(0,3).map(p=>p.name.split(' ')[0]).join(', ')}${movedUp.length>3?' +more':''}</span></div>`:''}${movedDown.length?`<div class="inline-flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-4 py-2"><span class="text-red-600 font-bold text-sm">▼ ${movedDown.length} moved down</span><span class="text-xs text-red-500">${movedDown.slice(0,3).map(p=>p.name.split(' ')[0]).join(', ')}${movedDown.length>3?' +more':''}</span></div>`:''}</div>`:''}
    ${ps.length>=3?`<div class="grid grid-cols-3 gap-4 max-w-2xl mx-auto"><div class="podium-silver rounded-2xl p-5 text-center mt-8 card-hover cursor-pointer" onclick="showProfile(${ps[1].id})"><div class="flex justify-center mb-1">${avatarHTML(ps[1],'md')}</div><p class="text-3xl">🥈</p><p class="font-bold text-lg mt-2">${ps[1].name}</p><p class="text-2xl font-bold text-slate-600">${ps[1].rating}</p><div class="flex justify-center gap-3 text-sm mt-1"><span class="text-court-600">${ps[1].wins}W</span><span class="text-red-500">${ps[1].losses}L</span></div><div class="mt-1">${rankMoveBadge(ps[1].id,2,prevAll)}</div></div><div class="podium-gold rounded-2xl p-5 text-center card-hover shadow-lg cursor-pointer" onclick="showProfile(${ps[0].id})"><div class="flex justify-center mb-1">${avatarHTML(ps[0],'lg')}</div><p class="text-4xl">🥇</p><p class="font-extrabold text-xl mt-2">${ps[0].name}</p><p class="text-3xl font-extrabold text-amber-600">${ps[0].rating}</p><div class="flex justify-center gap-3 text-sm mt-1"><span class="text-court-600">${ps[0].wins}W</span><span class="text-red-500">${ps[0].losses}L</span></div><div class="mt-1">${rankMoveBadge(ps[0].id,1,prevAll)}</div></div><div class="podium-bronze rounded-2xl p-5 text-center mt-12 card-hover cursor-pointer" onclick="showProfile(${ps[2].id})"><div class="flex justify-center mb-1">${avatarHTML(ps[2],'md')}</div><p class="text-3xl">🥉</p><p class="font-bold text-lg mt-2">${ps[2].name}</p><p class="text-2xl font-bold text-slate-600">${ps[2].rating}</p><div class="flex justify-center gap-3 text-sm mt-1"><span class="text-court-600">${ps[2].wins}W</span><span class="text-red-500">${ps[2].losses}L</span></div><div class="mt-1">${rankMoveBadge(ps[2].id,3,prevAll)}</div></div></div>`:''}
    <div class="card-glass rounded-2xl shadow-sm overflow-hidden"><table class="w-full"><thead class="bg-slate-50 border-b"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Rank</th><th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Player</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Move</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Rating</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Tier</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">W</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">L</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Played</th><th class="text-center px-6 py-3 text-xs font-semibold text-slate-500 uppercase">Win%</th></tr></thead><tbody class="divide-y divide-slate-100">${ps.map((p,i)=>{const t=tier(p.rating),pct=p.matchesPlayed?Math.round(p.wins/p.matchesPlayed*100):0;return`<tr class="hover:bg-slate-50/80 ${i<3?'bg-amber-50/30':''} cursor-pointer" onclick="showProfile(${p.id})"><td class="px-6 py-4 text-lg font-bold">${md(i)}</td><td class="px-6 py-4"><div class="flex items-center gap-2">${avatarHTML(p,'sm')}<span class="font-semibold text-slate-700">${p.name}</span></div></td><td class="px-6 py-4 text-center">${rankMoveBadge(p.id,i+1,prevAll)}</td><td class="px-6 py-4 text-center"><span class="text-xl font-bold text-brand-700">${p.rating}</span></td><td class="px-6 py-4 text-center"><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${t.c}">${t.e} ${t.l}</span></td><td class="px-6 py-4 text-center text-court-700 font-bold">${p.wins}</td><td class="px-6 py-4 text-center text-red-500 font-bold">${p.losses}</td><td class="px-6 py-4 text-center text-slate-600">${p.matchesPlayed}</td><td class="px-6 py-4 text-center">${p.matchesPlayed?`<div class="flex items-center justify-center gap-2"><div class="w-16 bg-slate-200 rounded-full h-2"><div class="bg-gradient-to-r from-court-500 to-emerald-400 h-2 rounded-full" style="width:${pct}%"></div></div><span class="text-sm font-medium">${pct}%</span></div>`:'<span class="text-slate-400">—</span>'}</td></tr>`}).join('')}</tbody></table></div>
  `}</div>`;
  // Persist current ranks for next comparison
  saveRanks('all',curAllRanks);
  if(ws)saveRanks('t_'+lwf,curTRanks);
}

/* ═══ INIT ═══ */
(async()=>{try{await openDB();await seed();rNav();await rPage()}catch(e){console.error('Init error:',e);document.getElementById('main-content').innerHTML=`<div class="max-w-2xl mx-auto p-8 text-center"><p class="text-4xl mb-4">⚠️</p><p class="text-lg font-bold text-red-600">Failed to initialize</p><p class="text-sm text-slate-500 mt-2">${e.message}</p><button onclick="indexedDB.deleteDatabase('PTSmashersDB');location.reload()" class="mt-4 bg-red-500 text-white px-6 py-2 rounded-xl font-semibold">Reset Database & Reload</button></div>`}})();
</script>
</body>
</html>
